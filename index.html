<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18+ Access</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111111, #3b1025);
      color: white;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      text-align: center;
      background: rgba(255,255,255,0.08);
      padding: 45px 30px;
      border-radius: 20px;
    }

    .age {
      display: inline-block;
      background: white;
      color: black;
      padding: 8px 15px;
      border-radius: 30px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    p {
      color: #ddd;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .enter {
      display: block;
      width: 100%;
      padding: 16px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .enter:hover {
      opacity: 0.85;
    }

    .small {
      font-size: 12px;
      margin-top: 20px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="age">18+</div>

    <h1>Welcome</h1>

    <p>
      This page is intended for adults aged 18 and over.
      Please confirm that you are 18 or older to continue.
    </p>

    <a
      class="enter"
      href="https://auctionr.org/4/464384f9f7fe70da94cb7ee64caa9dcd"
      rel="nofollow sponsored">
      ENTER — I AM 18+
    </a>

    <p class="small">
      By continuing, you confirm that you are 18+.
    </p>

  </div>

</body>
</html>
